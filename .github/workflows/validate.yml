name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check generated catalog
        run: python scripts/generate_catalog.py --check
      - name: Validate skills and links
        run: python scripts/validate_skills.py
      - name: Unit tests
        run: python -m unittest discover -s scripts/tests
